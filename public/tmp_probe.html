<!doctype html>
<html>
<body style="margin:0">
<iframe id="f" src="/faq" style="width:1440px;height:1200px;border:0"></iframe>
<script>
var f = document.getElementById('f');
f.onload = function () {
  setTimeout(function () {
    f.contentWindow.scrollTo(0, f.contentDocument.body.scrollHeight);
  }, 1200);
};
</script>
</body>
</html>
