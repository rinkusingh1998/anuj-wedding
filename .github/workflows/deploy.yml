name: Deploy Laravel Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/anuj-wedding

            echo "Pulling latest code..."
            GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/github_deploy -o IdentitiesOnly=yes" git pull --ff-only origin master

            echo "Installing dependencies..."
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

            echo "Clearing Laravel cache..."
            php artisan optimize:clear

            echo "Building Laravel cache..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Deployment completed!"
